<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find your next driver - prototype</title>
<style>
  :root { --sand:#f4efec; --page:#ffffff; --ink:#1a1617; --ink2:#585254; --hair:#e7e4e5; --teal:#2f6f5e; --tealbg:#eef5f2; --dark:#161214; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--dark); color: var(--ink); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; line-height: 1.55; }
  .stage { max-width: 480px; margin: 0 auto; min-height: 100dvh; background: var(--page); display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,.4); }
  .screen { flex: 1; display: flex; flex-direction: column; animation: rise .32s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--teal); }
  .hero { background: var(--dark); color: #fff; padding: 64px 24px 34px; }
  .hero .eyebrow { color: #8fd6c3; }
  .hero h1 { font-size: 40px; line-height: 1.02; font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; margin: 8px 0 14px; }
  .hero p { color: #cfccce; margin-bottom: 28px; }
  .big-cta { display: block; width: 100%; background: var(--teal); color: #fff; border: none; border-radius: 6px; padding: 16px; font-size: 15px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; min-height: 52px; }
  .section { padding: 24px; }
  .section h2 { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); margin: 18px 0 10px; }
  .section ul { padding-left: 18px; color: var(--ink2); }
  .section li { margin: 5px 0; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .tile { border: 1px solid var(--hair); border-radius: 10px; padding: 14px; font-weight: 600; font-size: 14px; color: var(--ink); }
  .tile span { display: block; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--teal); margin-top: 4px; }
  .qpage { flex: 1; display: flex; flex-direction: column; padding: 20px 22px 26px; }
  .progress { height: 3px; background: var(--hair); border-radius: 2px; overflow: hidden; margin-bottom: 22px; }
  .progress .fill { height: 100%; background: var(--teal); transition: width .3s ease; }
  h1.q { font-size: 25px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; margin: 10px 0 6px; }
  .why { background: none; border: none; color: var(--teal); font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px 0; margin-bottom: 16px; display: inline-flex; align-items: center; gap: 7px; }
  .why:before { content: "?"; display: inline-flex; width: 16px; height: 16px; border: 1.5px solid var(--teal); border-radius: 50%; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .why-panel { display: none; background: var(--tealbg); border-radius: 8px; padding: 11px 13px; font-size: 13px; color: var(--ink2); margin: -8px 0 16px; }
  .why-panel.open { display: block; animation: rise .2s ease both; }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .optbtn { border: 1px solid var(--hair); border-radius: 8px; padding: 15px 16px; background: var(--page); font-size: 16px; text-align: left; cursor: pointer; color: var(--ink); min-height: 52px; transition: border-color .15s, background .15s; }
  .optbtn.sel { border-color: var(--teal); background: var(--tealbg); font-weight: 600; box-shadow: inset 0 0 0 1px var(--teal); }
  .sel { width: 100%; border: 1px solid var(--hair); border-radius: 8px; padding: 15px 16px; font-size: 16px; background: var(--page); color: var(--ink); min-height: 52px; font-family: inherit; }
  .slider-wrap { margin: 30px 4px 6px; }
  input[type=range] { width: 100%; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--hair) 0 10px, #d8d4d5 10px 12px); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--teal); border: 3px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.35); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--teal); border: 3px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.35); cursor: pointer; }
  .slider-labels { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink2); margin-top: 12px; }
  .slider-labels span { cursor: pointer; padding: 10px 12px; }
  .slider-labels .on { color: var(--ink); font-weight: 700; }
  .navrow { margin-top: auto; display: flex; gap: 8px; align-items: center; padding-top: 24px; }
  .nav-back { background: none; border: none; color: var(--ink2); font-size: 15px; font-weight: 600; cursor: pointer; padding: 12px 10px; min-height: 48px; white-space: nowrap; }
  .nav-next { flex: 1; background: var(--ink); color: #fff; border: none; border-radius: 6px; padding: 15px; font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; min-height: 52px; }
  .nav-next[disabled] { opacity: .3; cursor: default; }
  .results { padding: 26px 22px 30px; }
  h1.res { font-size: 30px; line-height: 1.05; font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; margin: 8px 0 4px; }
  .res-intro { color: var(--ink2); margin-bottom: 18px; }
  .res-hero { border: 1.5px solid var(--teal); border-radius: 14px; padding: 18px; margin-bottom: 8px; background: linear-gradient(180deg, #f7fbf9, #fff); }
  .res-hero .tier { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--teal); }
  .res-hero .name { font-size: 25px; font-weight: 800; line-height: 1.12; text-transform: uppercase; letter-spacing: -0.01em; margin: 6px 0 2px; }
  .res-hero .spec { color: var(--ink2); font-size: 14px; }
  .res-hero .whyfit { margin-top: 10px; font-size: 14px; }
  .res-hero .pricerow { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
  .res-hero .price { font-size: 22px; font-weight: 800; }
  .match { display: inline-block; background: var(--tealbg); color: var(--teal); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 700; }
  h2.also { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin: 22px 0 6px; }
  .opt { border-top: 1px solid var(--hair); padding: 14px 0; display: flex; gap: 12px; }
  .opt .tiername { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); }
  .opt .name { font-weight: 700; }
  .opt .detail { color: var(--ink2); font-size: 14px; margin-top: 2px; }
  .opt .price { margin-left: auto; font-weight: 700; color: var(--teal); white-space: nowrap; }
  .callout { border-radius: 12px; padding: 13px 15px; margin: 16px 0; font-size: 14px; }
  .callout .t { font-weight: 700; display: block; margin-bottom: 2px; }
  .note { background: var(--tealbg); }
  .warn { background: var(--sand); }
  .cap { color: var(--ink2); font-size: 12px; margin-top: 10px; }
  .closing { color: var(--ink2); font-size: 12px; margin-top: 26px; border-top: 1px solid var(--hair); padding-top: 12px; }

    if (Number(a.spin)>win[1] && c.loft==='lower') parts.push('your spin is outside the optimal 2,000-2,700 window - too much spin gets affected by the wind, so this brings spin down');
  }
  return parts.join('; ')+'.';
}

function scoreShaft(sh, a, cat){
  var s=0, rule=SHAFT_MISS[a.miss];
  if (rule){
    if (rule.launch && sh.launch===rule.launch) s+=3;
    if (rule.light && sh.weight==='light') s+=2;
  }
  if (sh.flex.indexOf(flexFor(a.speed,cat))>=0) s+=3;
  if (a.spin && a.spin!=='skip'){
    var winS=SPIN_GOOD[cat];
    if (Number(a.spin)>winS[1]){ if (sh.launch==='low') s+=5; if (sh.launch==='high') s-=2; }
    if (Number(a.spin)<winS[0]){ if (sh.launch==='high') s+=5; if (sh.launch==='low') s-=2; }
  }
  if (a.flight==='low' && sh.launch==='low') s+=1;
  if (a.flight==='high' && sh.launch==='high') s+=1;
  if (a.flight==='mid' && sh.launch==='mid') s+=1;
  // high swing speed: lower launch, avoid ultralight shafts (placeholder)
  if (Number(a.speed)>=110){
    if (sh.launch==='low') s+=1;
    if (sh.weight==='light') s-=1;
  }
  return s;
}
function shaftReason(sh, a, cat){
  var parts=[], rule=SHAFT_MISS[a.miss];
  if (rule){
    var matchS = (rule.launch && sh.launch===rule.launch) || (rule.light && sh.weight==='light') || (!rule.launch && !rule.light);
    parts.push(a.miss==='straight' ? rule.fight : (matchS ? 'Picked to fight your miss: '+rule.fight : 'Picked with your miss in mind'));
  }
  var f=flexFor(a.speed,cat);
  if (sh.flex.indexOf(f)>=0) parts.push(a.speed==='unsure' ? f+' flex is the safe default without your speed' : f+' flex suits your club head speed');
  if (a.spin && a.spin!=='skip'){
    var winS=SPIN_GOOD[cat];
    if (Number(a.spin)<winS[0] && sh.launch==='high') parts.push('your spin is outside the optimal 2,000-2,700 window - too little spin can cause dive bombs and carry loss, so this adds launch and spin');
    if (Number(a.spin)>winS[1] && sh.launch==='low') parts.push('your spin is outside the optimal 2,000-2,700 window - too much spin gets affected by the wind, so this brings spin down');
  }
  parts.push(sh.note);
  return parts.join('; ')+'.';
}

function fmt(n){ return '\u00A3'+Number(n).toLocaleString('en-GB'); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
var app = document.getElementById('app');

function matchPct(s){ return Math.max(78, Math.min(97, 70 + Math.round(s*2.5))); }
function toggleWhy(btn){
  var p = btn.parentNode.querySelector('.why-panel');
  if (p) p.classList.toggle('open');
}
function sliderPreview(inp){
  var i = Number(inp.value);
  var spans = inp.parentNode.querySelectorAll('.slider-labels span');
  spans.forEach(function(s,j){ s.className = j===i ? 'on' : ''; });
}
function setSlider(id, v){
  var qs = buildQuestions(state.cat, state.a);
  var q = qs[state.step];
  if (q && q.opts[Number(v)]) state.a[id] = q.opts[Number(v)][0];
  render();
}

function render(){
  var h='';
  if (!state.cat){
    h = '<div class="hero"><div class="eyebrow">Prototype demo</div>'
      + '<h1>Find your next driver</h1>'
      + '<p>Answer a few questions about your game, your current driver and what you want next. Get picks from this shop\u2019s stock at three prices, each chosen to fight your miss.</p>'
      + '<button class="big-cta" onclick="pick(\'driver\')">Get started</button></div>'
      + '<div class="section">'
      + '<h2>How it works</h2><ul><li>A few quick questions about your game and your current driver - one per screen, no typing.</li><li>Your current miss drives the picks: head, loft, shaft and weight features that counter it.</li><li>Three prices: best value, mid-range and a clearly labelled step-up option, each with the reason why.</li></ul>'
      + '<div class="callout note"><span class="t">Guidance, not a fitting</span>Recommendations here are general guidance from your answers, not a custom fitting. Nothing is reserved or bought from this page.</div>'
      + '<h2>In development</h2><div class="tiles">'
      + '<div class="tile">Iron selector<span>Coming soon</span></div>'
      + '<div class="tile">Wedge selector<span>Coming soon</span></div>'
      + '<div class="tile">Putter selector<span>Coming soon</span></div>'
      + '<div class="tile">Golf ball selector<span>Coming soon</span></div></div>'
      + '<div class="cap">Prototype for second-hand golf shops and golf stores. '+DATA_NOTE+'</div></div>';
  } else if (state.done){
    var cat=state.cat, a=state.a;
    var mode = a.likePart==='head' ? 'shaft' : (a.likePart==='shaft' ? 'head' : 'club');
    var likesBoth = a.likePart==='both';
    var shaftCat = cat==='driver' ? 'wood' : 'iron';
    var titles = {club: cat==='driver'?'Your driver matches':'Your iron matches',
                  both: cat==='driver'?'Good news - your driver suits you':'Good news - your irons suit you',
                  shaft: cat==='driver'?'Your shaft matches':'Your iron shaft matches',
                  head: cat==='driver'?'Your head matches':'Your iron head matches'};
    var intros = {club: 'Three picks from this shop\u2019s stock at different prices, each chosen to fight your miss.',
                  both: 'You like both your current head and shaft, so your current set up is great for you. No change needed - but if you fancy trying something new, here are options worth a look, each chosen to fight your miss.',
                  shaft: 'Keeping your current head. Three shaft options at different prices, each chosen to fight your miss.',
                  head: 'Keeping your current shaftSHAFTNAME. Three head options at different prices, each chosen to fight your miss.'};
    var shaftDetail = (a.currentShaftWeight && a.currentShaftWeight!=='unsure' ? ' '+a.currentShaftWeight : '') + (a.currentShaftFlex && a.currentShaftFlex!=='unsure' ? ', '+a.currentShaftFlex+' flex' : '');
    var knownShaft = a.currentShaftModel && a.currentShaftModel!=='other' && a.currentShaftModel!=='unsure' ? ' ('+a.currentShaftModel+shaftDetail+')' : '';
    intros.head = intros.head.replace('SHAFTNAME', knownShaft);
    h = '<div class="results"><div class="eyebrow">Your results</div>'
      + '<h1 class="res">'+(likesBoth?titles.both:titles[mode])+'</h1>'
      + '<p class="res-intro">'+(likesBoth?intros.both:intros[mode])+'</p>'
      + (likesBoth && a.currentBrand && a.currentBrand!=='other' && a.currentModel && a.currentModel!=='other'
          ? '<div class="callout note"><span class="t">Keeping your '+esc(a.currentBrand+' '+a.currentModel)+'</span>You said you like it, and nothing here beats a club you already get on with. The picks below are only for trying something different.</div>' : '');
    if (mode==='shaft'){
      var pool2=SHAFTS.filter(function(c){return c.cat===shaftCat && c.price!==null;});
      var sc2=pool2.map(function(c){return {c:c,s:scoreShaft(c,a,cat)};});
      var pr2=pool2.map(function(c){return c.price;});
      var lo2=Math.min.apply(null,pr2), hi2=Math.max.apply(null,pr2), span2=(hi2-lo2)/3;
      function inTier2(c,t){ return c.price>=lo2+span2*t && (t===2 || c.price<lo2+span2*(t+1)); }
      var used2={}, byS2=sc2.slice().sort(function(x,y){return y.s-x.s || x.c.price-y.c.price;});
      function claim2(t){
        var p=byS2.find(function(x){return inTier2(x.c,t) && !used2[x.c.id];}) || byS2.find(function(x){return !used2[x.c.id];});
        if (p) used2[p.c.id]=1; return p||null;
      }
      var sb=claim2(0), sm=claim2(1), sp=claim2(2);
      var srows=[['Best value',sb],['Mid-range',sm],['Step-up pick',sp]].filter(function(r){return r[1];});
      if (srows.length){
        var lead=srows[0][1];
        h += '<div class="res-hero"><span class="tier">Best value - our recommendation</span>'
          + '<div class="name">'+esc(lead.c.brand+' '+lead.c.model)+'</div>'
          + '<div class="whyfit">'+esc(shaftReason(lead.c,a,cat))+'</div>'
          + '<div class="pricerow"><span class="price">'+fmt(lead.c.price)+'</span><span class="match">'+matchPct(lead.s)+'% match*</span></div></div>';
      }
      if (srows.length>1){
        h += '<h2 class="also">Also in the running</h2>';
        srows.slice(1).forEach(function(r){
          h += '<div class="opt"><div><div class="tiername">'+r[0]+'</div><div class="name">'+esc(r[1].c.brand+' '+r[1].c.model)+'</div>'
            + '<div class="detail">'+esc(shaftReason(r[1].c,a,cat))+'</div></div>'
            + '<span class="price">'+fmt(r[1].c.price)+'</span></div>';
        });
      }
      h += '<div class="cap">* Illustrative match score from placeholder matching logic. Shaft prices are unverified guide prices, per shaft for irons. Fitting/labour not included. Best value is the honest recommendation; the step-up is optional.</div>';
      if (sp && sb && sp.c.id!==sb.c.id && sp.c.price>sb.c.price){
        h += '<div class="callout note"><span class="t">'+esc(sp.c.brand+' '+sp.c.model)+' - '+fmt(sp.c.price)+'</span>'
          + 'Optional upgrade, clearly labelled. Premium shaft materials and tighter manufacturing tolerances for '+fmt(sp.c.price-sb.c.price)+' more. The best-value pick above remains the recommendation; choose this only if the extra spend is worth it to you.</div>';
      }
    } else {
      var pool=STOCK.filter(function(c){return c.cat===cat && c.dex.indexOf(a.dexterity)>=0 && c.price!==null;});
      var scored=pool.map(function(c){return {c:c,s:score(c,a,cat)};});
      var prices=pool.map(function(c){return c.price;});
      var lo=Math.min.apply(null,prices), hi=Math.max.apply(null,prices), span=(hi-lo)/3;
      function inTier(c,t){ return c.price>=lo+span*t && (t===2 || c.price<lo+span*(t+1)); }
      var used={}, byScore=scored.slice().sort(function(x,y){return y.s-x.s || x.c.price-y.c.price;});
      function claimTier(t){
        var p=byScore.find(function(x){return inTier(x.c,t) && !used[x.c.id];}) || byScore.find(function(x){return !used[x.c.id];});
        if (p) used[p.c.id]=1; return p||null;
      }
      var b=claimTier(0), m=claimTier(1), p=claimTier(2);
      var rows=[['Best value',b],['Mid-range',m],['Step-up pick',p]].filter(function(r){return r[1];});
      if (rows.length){
        var lead2=rows[0][1];
        h += '<div class="res-hero"><span class="tier">Best value - our recommendation</span>'
          + '<div class="name">'+esc(lead2.c.brand+' '+lead2.c.model)+(lead2.c.model.indexOf(String(lead2.c.year))<0?' ('+lead2.c.year+')':'')+'</div>'
          + '<div class="spec">'+esc(lead2.c.spec)+'</div>'
          + '<div class="whyfit">'+esc(reason(lead2.c,a,cat))+'</div>'
          + '<div class="pricerow"><span class="price">'+fmt(lead2.c.price)+'</span><span class="match">'+matchPct(lead2.s)+'% match*</span></div></div>';
      }
      if (rows.length>1){
        h += '<h2 class="also">Also in the running</h2>';
        rows.slice(1).forEach(function(r){
          h += '<div class="opt"><div><div class="tiername">'+r[0]+'</div><div class="name">'+esc(r[1].c.brand+' '+r[1].c.model)+(r[1].c.model.indexOf(String(r[1].c.year))<0?' ('+r[1].c.year+')':'')+'</div>'
            + '<div class="detail">'+esc(r[1].c.spec)+'. '+esc(reason(r[1].c,a,cat))+'</div></div>'
            + '<span class="price">'+fmt(r[1].c.price)+'</span></div>';
        });
      }
      h += '<div class="cap">* Illustrative match score from placeholder matching logic. '+DATA_NOTE+(mode==='head'?' Prices are full-club RRPs shown for reference; a live version would price heads only.':'')+' Best value is the honest recommendation; the step-up is optional.</div>';
      if (p && b && p.c.id!==b.c.id && p.c.price>b.c.price){
        var benefit = p.c.year>b.c.year
          ? 'Newer model year: more recent face technology, typically a little more ball speed and forgiveness for '+fmt(p.c.price-b.c.price)+' more.'
          : 'Higher-spec model in the current range for '+fmt(p.c.price-b.c.price)+' more - premium head and shaft options.';
        h += '<div class="callout note"><span class="t">'+esc(p.c.brand+' '+p.c.model)+' - '+fmt(p.c.price)+'</span>'
          + 'Optional upgrade, clearly labelled. '+benefit+' The best-value pick above remains the recommendation; choose this only if the extra spend is worth it to you.</div>';
      }
      if (mode==='head'){
        var known = a.currentShaftModel && a.currentShaftModel!=='other' && a.currentShaftModel!=='unsure';
        var cur = known ? SHAFTS.find(function(x){return x.model===a.currentShaftModel && x.cat==='wood';}) : null;
        h += '<h2 class="also">Your shaft stays</h2>';
        if (cur){
          h += '<div class="callout note"><span class="t">Keeping your '+esc(cur.brand+' '+cur.model+shaftDetail)+'</span>'
            + 'You like your current shaft, so it stays with the new head. Its profile: '+cur.weight+' weight, '+cur.flex.join('/')+' flex, '+cur.launch+' launch. If you ever fancy a change, these have similar characteristics:</div>';
          var sim = SHAFTS.filter(function(x){return x.cat==='wood' && x.id!==cur.id;}).map(function(x){
            var sc=0;
            if (x.launch===cur.launch) sc+=2;
            if (x.weight===cur.weight) sc+=1;
            if (x.flex.some(function(f){return cur.flex.indexOf(f)>=0;})) sc+=1;
            return {x:x, sc:sc};
          }).sort(function(m,n){return n.sc-m.sc || m.x.price-n.x.price;}).slice(0,3);
          sim.forEach(function(r,i){
            h += '<div class="opt"><div><div class="tiername">Similar '+(i+1)+'</div><div class="name">'+esc(r.x.brand+' '+r.x.model)+'</div>'
              + '<div class="detail">Similar to yours: '+r.x.weight+' weight, '+r.x.launch+' launch. '+esc(r.x.note)+'</div></div>'
              + '<span class="price">'+fmt(r.x.price)+'</span></div>';
          });
        } else {
          var suit = SHAFTS.filter(function(x){return x.cat==='wood';}).map(function(x){return {x:x, sc:scoreShaft(x,a,cat)};})
            .sort(function(m,n){return n.sc-m.sc || m.x.price-n.x.price;}).slice(0,2);
          h += '<div class="callout note"><span class="t">Your shaft stays</span>You like your current shaft, so it stays with the new head. We do not know which shaft it is, so these would suit your answers if you ever change:</div>';
          suit.forEach(function(r,i){
            h += '<div class="opt"><div><div class="tiername">Suits your answers</div><div class="name">'+esc(r.x.brand+' '+r.x.model)+'</div>'
              + '<div class="detail">'+esc(shaftReason(r.x,a,cat))+'</div></div>'
              + '<span class="price">'+fmt(r.x.price)+'</span></div>';
          });
        }
        h += '<div class="cap">Shaft prices are unverified guide prices.</div>';
      }
    }
    h += '<div class="callout warn"><span class="t">Before you buy</span>This is general guidance from your answers, not a custom fitting. '+DATA_NOTE+' A live version would show the shop\u2019s real inventory and prices.</div>'
      + '<div class="navrow"><button class="nav-back" onclick="back()">\u2039 Back</button><button class="nav-next" onclick="restart()">Start again</button></div>'
      + '<div class="closing">Iron, wedge, putter and golf ball selectors are in development. Prototype for shop demos. No purchase or reservation happens here.</div></div>';
  } else {
    var qs=buildQuestions(state.cat, state.a);
    var q=qs[state.step], val=state.a[q.id];
    h = '<div class="qpage"><div class="progress"><div class="fill" style="width:'+Math.round(((state.step+1)/qs.length)*100)+'%"></div></div>'
      + '<div class="eyebrow">Question '+(state.step+1)+' of '+qs.length+'</div>'
      + '<h1 class="q">'+esc(q.label)+'</h1>';
    if (q.help) h += '<button class="why" onclick="toggleWhy(this)">Why we ask this</button><div class="why-panel">'+esc(q.help)+'</div>';
    if (q.kind==='dropdown'){
      h += '<select class="sel" onchange="setA(\''+q.id+'\',this.value)">'
        + '<option value="" disabled'+(val?'':' selected')+'>Choose...</option>'
        + q.opts.map(function(o){ return '<option value="'+o[0]+'"'+(val===o[0]?' selected':'')+'>'+esc(o[1])+'</option>'; }).join('')
        + '</select>';
    } else if (q.id==='flight'){
      var stops=q.opts;
      var idx=-1;
      stops.forEach(function(o,i){ if (val===o[0]) idx=i; });
      h += '<div class="slider-wrap">'
        + '<input type="range" min="0" max="'+(stops.length-1)+'" step="1" value="'+(idx<0?1:idx)+'" oninput="sliderPreview(this)" onchange="setSlider(\''+q.id+'\',this.value)" aria-label="'+esc(q.label)+'">'
        + '<div class="slider-labels">'+stops.map(function(o,i){ return '<span class="'+(idx===i?'on':'')+'" onclick="setSlider(\''+q.id+'\','+i+')" role="button">'+esc(o[1])+'</span>'; }).join('')+'</div>'
        + (idx<0?'<div class="cap">Slide to choose</div>':'')+'</div>';
    } else {
      h += '<div class="opts">';
      q.opts.forEach(function(o){
        h += '<button class="optbtn'+(val===o[0]?' sel':'')+'" onclick="setA(\''+q.id+'\',\''+o[0]+'\')">'+esc(o[1])+'</button>';
      });
      h += '</div>';
    }
    var canNext = Boolean(val);
    var last = state.step===qs.length-1;
    h += '<div class="navrow"><button class="nav-back" onclick="back()">\u2039 Back</button>'
      + '<button class="nav-next" '+(canNext?'':'disabled')+' onclick="next()">'+(last?'See my matches':'Next')+'</button></div></div>';
  }
  app.innerHTML = h;
}
function pick(c){ state.cat=c; state.step=0; render(); window.scrollTo(0,0); }
function setA(id,v){ state.a[id]=v; render(); }
function back(){
  if (state.done){ state.done=false; render(); window.scrollTo(0,0); return; }
  var qs=buildQuestions(state.cat, state.a);
  if (state.step>0) { state.step--; if (qs[state.step] && qs[state.step].id==='currentModel' && state.a.currentBrand==='other') state.step--; }
  else state.cat=null;
  render(); window.scrollTo(0,0);
}
function next(){
  var qs=buildQuestions(state.cat, state.a);
  if (state.step===qs.length-1) { state.done=true; }
  else {
    state.step++;
    // skip the model dropdown when the brand is Other / not listed
    if (qs[state.step] && qs[state.step].id==='currentModel' && state.a.currentBrand==='other'){ state.a.currentModel='other'; state.step++; }
  }
  render(); window.scrollTo(0,0);
}
function restart(){ state={cat:null,step:0,a:{},done:false}; render(); window.scrollTo(0,0); }

// Hash overrides for testing/screenshots: #q=driver,5, #results-driver, #results-irons
(function(){
  var h=location.hash||'';
  if (h.indexOf('#q=')===0){
    var parts=h.slice(3).split(','); state.cat=parts[0]; state.step=Number(parts[1]||0);
    for (var i=2;i<parts.length;i++){ var kv=parts[i].split('='); state.a[kv[0]]=decodeURIComponent(kv.slice(1).join('=')); }
  } else if (h==='#results-driver'){
    state={cat:'driver',step:0,done:true,a:{dexterity:'R',speed:'90',spin:'1900',currentBrand:'other',currentModel:'other',likePart:'both',brand:'Any',miss:'low',flight:'high'}};
  } else if (h==='#results-shafts'){
    state={cat:'driver',step:0,done:true,a:{dexterity:'R',speed:'90',spin:'2850',currentBrand:'TaylorMade',currentModel:'Qi4D Driver',likePart:'head',brand:'Any',miss:'slice',flight:'mid'}};
  } else if (h==='#results-heads'){
    state={cat:'driver',step:0,done:true,a:{dexterity:'R',speed:'100',spin:'skip',currentBrand:'Ping',currentModel:'other',currentShaftBrand:'Fujikura',currentShaftModel:'Ventus Blue',currentShaftWeight:'60g',currentShaftFlex:'S',likePart:'shaft',brand:'Any',miss:'slice',flight:'mid'}};
  } else if (h==='#results-irons'){
    state={cat:'irons',step:0,done:true,a:{dexterity:'R',speed:'70',spin:'skip',currentBrand:'other',currentModel:'other',likePart:'both',brand:'Any',miss:'fat',flight:'high'}};
  }
  render();
})();
