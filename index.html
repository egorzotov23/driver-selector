<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipment Selector - prototype</title>
<style>
  :root { --sand:#f4efec; --page:#ffffff; --ink:#1a1617; --ink2:#585254; --hair:#e7e4e5; --teal:#2f6f5e; --tealbg:#eef5f2; --dark:#161214; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--sand); color: var(--ink); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; line-height: 1.55; }
  .stage { max-width: 480px; margin: 0 auto; min-height: 100dvh; background: var(--page); display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,.4); }
  .screen { flex: 1; display: flex; flex-direction: column; animation: rise .32s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--teal); }
  .hero { background: var(--tealbg); color: var(--ink); padding: 56px 24px 30px; }
  .hero h1 { color: var(--ink); }
  .tile-link { cursor: pointer; border: 1.5px solid var(--teal); background: #fff; }
  .tile-link span { color: var(--teal); }
  .hero .eyebrow { color: var(--teal); }
  .hero h1 { font-size: 40px; line-height: 1.02; font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; margin: 8px 0 14px; }
  .hero p { color: var(--ink2); margin-bottom: 4px; }
  .big-cta { display: block; width: 100%; background: var(--teal); color: #fff; border: none; border-radius: 6px; padding: 16px; font-size: 15px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; min-height: 52px; }
  .section { padding: 24px; }
  .section h2 { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); margin: 18px 0 10px; }
  .section ul { padding-left: 18px; color: var(--ink2); }
  .section li { margin: 5px 0; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .tile { border: 1px solid var(--hair); border-radius: 10px; padding: 14px; font-weight: 600; font-size: 14px; color: var(--ink); }
  .tile span { display: block; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--teal); margin-top: 4px; }
  .qpage { flex: 1; display: flex; flex-direction: column; padding: 20px 22px 26px; }
  .progress { height: 3px; background: var(--hair); border-radius: 2px; overflow: hidden; margin-bottom: 22px; }
  .progress .fill { height: 100%; background: var(--teal); transition: width .3s ease; }
  h1.q { font-size: 25px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; margin: 10px 0 6px; }
  .why { background: none; border: none; color: var(--teal); font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px 0; margin-bottom: 16px; display: inline-flex; align-items: center; gap: 7px; }
  .why:before { content: "?"; display: inline-flex; width: 16px; height: 16px; border: 1.5px solid var(--teal); border-radius: 50%; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .why-panel { display: none; background: var(--tealbg); border-radius: 8px; padding: 11px 13px; font-size: 13px; color: var(--ink2); margin: -8px 0 16px; }
  .why-panel.open { display: block; animation: rise .2s ease both; }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .optbtn { border: 1px solid var(--hair); border-radius: 8px; padding: 15px 16px; background: var(--page); font-size: 16px; text-align: left; cursor: pointer; color: var(--ink); min-height: 52px; transition: border-color .15s, background .15s; }
  .optbtn.sel { border-color: var(--teal); background: var(--tealbg); font-weight: 600; box-shadow: inset 0 0 0 1px var(--teal); }
  .sel { width: 100%; border: 1px solid var(--hair); border-radius: 8px; padding: 15px 16px; font-size: 16px; background: var(--page); color: var(--ink); min-height: 52px; font-family: inherit; }
  .slider-wrap { margin: 30px 4px 6px; }
  input[type=range] { width: 100%; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--hair) 0 10px, #d8d4d5 10px 12px); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--teal); border: 3px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.35); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--teal); border: 3px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.35); cursor: pointer; }
  .slider-labels { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink2); margin-top: 12px; }
  .slider-labels span { cursor: pointer; padding: 10px 12px; }
  .slider-labels .on { color: var(--ink); font-weight: 700; }
  .navrow { margin-top: auto; display: flex; gap: 8px; align-items: center; padding-top: 24px; }
  .nav-back { background: none; border: none; color: var(--ink2); font-size: 15px; font-weight: 600; cursor: pointer; padding: 12px 10px; min-height: 48px; white-space: nowrap; }
  .nav-next { flex: 1; background: var(--ink); color: #fff; border: none; border-radius: 6px; padding: 15px; font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; min-height: 52px; }
  .nav-next[disabled] { opacity: .3; cursor: default; }
  .results { padding: 26px 22px 30px; }
  h1.res { font-size: 30px; line-height: 1.05; font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; margin: 8px 0 4px; }
  .res-intro { color: var(--ink2); margin-bottom: 18px; }
  .res-hero { border: 1.5px solid var(--teal); border-radius: 14px; padding: 18px; margin-bottom: 8px; background: linear-gradient(180deg, #f7fbf9, #fff); }
  .res-hero .tier { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--teal); }
  .res-hero .name { font-size: 25px; font-weight: 800; line-height: 1.12; text-transform: uppercase; letter-spacing: -0.01em; margin: 6px 0 2px; }
  .res-hero .spec { color: var(--ink2); font-size: 14px; }
  .res-hero .whyfit { margin-top: 10px; font-size: 14px; }
  .res-hero .pricerow { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
  .res-hero .price { font-size: 22px; font-weight: 800; }
  .match { display: inline-block; background: var(--tealbg); color: var(--teal); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 700; }
  h2.also { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin: 22px 0 6px; }
  .opt { border-top: 1px solid var(--hair); padding: 14px 0; display: flex; gap: 12px; }
  .opt .tiername { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); }
  .opt .name { font-weight: 700; }
  .opt .detail { color: var(--ink2); font-size: 14px; margin-top: 2px; }
  .opt .price { margin-left: auto; font-weight: 700; color: var(--teal); white-space: nowrap; }
  .callout { border-radius: 12px; padding: 13px 15px; margin: 16px 0; font-size: 14px; }
  .callout .t { font-weight: 700; display: block; margin-bottom: 2px; }
  .note { background: var(--tealbg); }
  .warn { background: var(--sand); }
  .cap { color: var(--ink2); font-size: 12px; margin-top: 10px; }
  .closing { color: var(--ink2); font-size: 12px; margin-top: 26px; border-top: 1px solid var(--hair); padding-top: 12px; }
</style>

function scoreBall(b, a){
  var s=0;
  var sp = a.speed==='unsure' ? null : Number(a.speed);
  if (sp!==null && !isNaN(sp)){
    if (sp<85){ if (b.comp==='low') s+=4; if (b.comp==='high') s-=2; }
    else if (sp<95){ if (b.comp!=='high') s+=3; }
    else if (sp<105){ if (b.comp!=='low') s+=3; }
    else { if (b.comp==='high') s+=4; if (b.comp==='low') s-=2; }
  }
  if (a.ballPriority==='feel' && b.feel==='soft') s+=4;
  if (a.ballPriority==='spin' && b.spin==='high') s+=4;
  if (a.ballPriority==='distance' && (b.flight==='high' || b.spin==='low')) s+=4;
  if (a.ballPriority==='straight' && b.straight) s+=4;
  if (b.flight===a.flight) s+=2;
  return s;
}
function ballReason(b, a){
  var parts=[];
  var sp = a.speed==='unsure' ? null : Number(a.speed);
  if (sp!==null && !isNaN(sp)){
    if (sp<85 && b.comp==='low') parts.push('lower compression suits your swing speed');
    else if (sp>=105 && b.comp==='high') parts.push('firmer, higher compression holds up to your speed');
    else if (sp>=85 && sp<105) parts.push('compression suits your swing speed');
  }
  if (a.ballPriority==='feel' && b.feel==='soft') parts.push('soft feel, as you wanted');
  if (a.ballPriority==='spin' && b.spin==='high') parts.push('high greenside spin, as you wanted');
  if (a.ballPriority==='distance' && (b.flight==='high'||b.spin==='low')) parts.push('built for distance off the tee');
  if (a.ballPriority==='straight' && b.straight) parts.push('low long-game spin helps calm a curve');
  if (b.flight===a.flight) parts.push(b.flight+' flight, as you wanted');
  parts.push(b.note);
  return parts.join('; ')+'.';
}

var state = {cat:null, step:0, a:{}, done:false};

function flexFor(speed, cat){
  if (speed==='unsure' || !speed) return 'Regular';
  var r = cat==='driver'?DRIVER_FLEX:IRON_FLEX;
  for (var i=0;i<r.length;i++) if (Number(speed)<=r[i][0]) return r[i][1];
  return 'Regular';
}
function score(c, a, cat){
  var s=0, rule=MISS_RULES[a.miss];
  if (rule){
    if (rule.bias && c.bias===rule.bias) s+=4;
    if (rule.loft && c.loft===rule.loft) s+=3;
    if (rule.light && c.weight==='light') s+=2;
    if (rule.gi && c.style==='gi') s+=3;
  }
  if (c.flex.indexOf(flexFor(a.speed,cat))>=0) s+=2;
  var wantsGI = a.speed!=='unsure' && Number(a.speed) < GI_CUTOFF[cat];
  if ((wantsGI && c.style==='gi') || (!wantsGI && c.style==='players')) s+=1;
  // spin refinement when the golfer shared it (Egor's windows)
  if (a.spin && a.spin!=='skip'){
    var win=SPIN_GOOD[cat];
    if (Number(a.spin)>win[1] && c.loft==='lower') s+=3;
    if (Number(a.spin)<win[0] && c.loft==='higher') s+=3;
  }
  if (c.flight===a.flight) s+=1;
  // high swing speed: lower loft/spin heads, avoid ultralight builds (placeholder)
  if (Number(a.speed)>=110){
    if (c.loft==='lower') s+=1;
    if (c.weight==='light') s-=1;
  }
  if (a.brand && a.brand!=='Any' && c.brand===a.brand) s+=3;
  if (validPrefHead(a,cat)===c.model) s+=8;
  return s;
}
function reason(c, a, cat){
  var parts=[], rule=MISS_RULES[a.miss];
  if (rule){
    var matchC = (rule.bias && c.bias===rule.bias) || (rule.loft && c.loft===rule.loft) || (rule.light && c.weight==='light') || (rule.gi && c.style==='gi') || (!rule.bias && !rule.loft && !rule.light && !rule.gi);
    parts.push(a.miss==='straight' ? rule.fight : (matchC ? 'Picked to fight your miss: '+rule.fight : 'Picked with your miss in mind'));
  }
  var f=flexFor(a.speed,cat);
  if (c.flex.indexOf(f)>=0) parts.push(a.speed==='unsure' ? f+' flex is the safe default without your speed' : f+' flex suits your club head speed');
  if (c.flight===a.flight) parts.push(c.flight+' flight, as you wanted');
  if (a.brand && a.brand!=='Any' && c.brand===a.brand) parts.push('your preferred brand');
  if (validPrefHead(a,cat)===c.model) parts.unshift('It is the head you told us you like');
  if (a.spin && a.spin!=='skip'){
    var win=SPIN_GOOD[cat];
    if (Number(a.spin)<win[0] && c.loft==='higher') parts.push('your spin is outside the optimal 2,000-2,700 window - too little spin can cause dive bombs and carry loss, so this adds launch and spin');
    if (Number(a.spin)>win[1] && c.loft==='lower') parts.push('your spin is outside the optimal 2,000-2,700 window - too much spin gets affected by the wind, so this brings spin down');
  }
  return parts.join('; ')+'.';
}

function scoreShaft(sh, a, cat){
  var s=0, rule=SHAFT_MISS[a.miss];
  if (rule){
    if (rule.launch && sh.launch===rule.launch) s+=3;
    if (rule.light && sh.weight==='light') s+=2;
  }
  if (sh.flex.indexOf(flexFor(a.speed,cat))>=0) s+=3;
  if (a.spin && a.spin!=='skip'){
    var winS=SPIN_GOOD[cat];
    if (Number(a.spin)>winS[1]){ if (sh.launch==='low') s+=5; if (sh.launch==='high') s-=2; }
    if (Number(a.spin)<winS[0]){ if (sh.launch==='high') s+=5; if (sh.launch==='low') s-=2; }
  }
  if (a.flight==='low' && sh.launch==='low') s+=1;
  if (a.flight==='high' && sh.launch==='high') s+=1;
  if (a.flight==='mid' && sh.launch==='mid') s+=1;
  // high swing speed: lower launch, avoid ultralight shafts (placeholder)
  if (Number(a.speed)>=110){
    if (sh.launch==='low') s+=1;
    if (sh.weight==='light') s-=1;
  }
  if (validPrefShaft(a,cat)===sh.model) s+=8;
  return s;
}
function shaftReason(sh, a, cat){
  var parts=[], rule=SHAFT_MISS[a.miss];
  if (rule){
    var matchS = (rule.launch && sh.launch===rule.launch) || (rule.light && sh.weight==='light') || (!rule.launch && !rule.light);
    parts.push(a.miss==='straight' ? rule.fight : (matchS ? 'Picked to fight your miss: '+rule.fight : 'Picked with your miss in mind'));
  }
  var f=flexFor(a.speed,cat);
  if (sh.flex.indexOf(f)>=0) parts.push(a.speed==='unsure' ? f+' flex is the safe default without your speed' : f+' flex suits your club head speed');
  if (a.spin && a.spin!=='skip'){
    var winS=SPIN_GOOD[cat];
    if (Number(a.spin)<winS[0] && sh.launch==='high') parts.push('your spin is outside the optimal 2,000-2,700 window - too little spin can cause dive bombs and carry loss, so this adds launch and spin');
    if (Number(a.spin)>winS[1] && sh.launch==='low') parts.push('your spin is outside the optimal 2,000-2,700 window - too much spin gets affected by the wind, so this brings spin down');
  }
  if (validPrefShaft(a,cat)===sh.model) parts.unshift('It is the shaft you told us you like');
  parts.push(sh.note);
  return parts.join('; ')+'.';
}

          + SHAFT_BRANDS.map(function(b){
              var items=SHAFTS.filter(function(x){return x.cat===shCat && x.brand===b;});
              if (!items.length) return '';
              return '<optgroup label="'+esc(b)+'">'+items.map(function(x){ return '<option value="'+esc(x.model)+'"'+(a.prefShaft===x.model?' selected':'')+'>'+esc(x.model)+'</option>'; }).join('')+'</optgroup>';
            }).join('')
          + '</select>';
        var psh=(a.prefShaft && a.prefShaft!=='any') ? SHAFTS.find(function(x){return x.cat===shCat && x.model===a.prefShaft;}) : null;
        if (psh && psh.wts){
          var psw=a.prefShaftWeight;
          var psWf=(psw && psw!=='unsure') ? psh.wts.find(function(w){return w[0]===psw;}) : null;
          var psFlexes=psWf ? psWf[1] : Array.from(new Set(psh.wts.reduce(function(acc,w){return acc.concat(w[1]);},[])));
          var psf=a.prefShaftFlex;
          h += '<div class="eyebrow" style="margin:16px 0 6px">Weight</div>'
            + '<select class="sel" onchange="setA(\'prefShaftWeight\',this.value)">'
            + '<option value="" disabled'+(psw?'':' selected')+'>Choose...</option>'
            + psh.wts.map(function(w){ return '<option value="'+w[0]+'"'+(psw===w[0]?' selected':'')+'>'+esc(w[0])+'</option>'; }).join('')
            + '<option value="unsure"'+(psw==='unsure'?' selected':'')+'>Not sure</option>'
            + '</select>'
            + '<div class="eyebrow" style="margin:16px 0 6px">Flex</div>'
            + '<select class="sel" onchange="setA(\'prefShaftFlex\',this.value)">'
            + '<option value="" disabled'+(psf?'':' selected')+'>Choose...</option>'
            + psFlexes.map(function(f){ return '<option value="'+f+'"'+(psf===f?' selected':'')+'>'+esc(f)+'</option>'; }).join('')
            + '<option value="unsure"'+(psf==='unsure'?' selected':'')+'>Not sure</option>'
            + '</select>';
        }
      }
      if (lp==='neither' && a.prefHead && a.prefHead!=='any' && a.prefShaft && a.prefShaft!=='any'){
        var hd=STOCK.find(function(c){return c.cat===cat && c.model===a.prefHead;});
        var shf=SHAFTS.find(function(x){return x.cat===shCat && x.model===a.prefShaft;});
        if (hd && shf){
          var pspec = (a.prefShaftWeight && a.prefShaftWeight!=='unsure' ? ' You picked it in '+a.prefShaftWeight : '') + (a.prefShaftFlex && a.prefShaftFlex!=='unsure' ? ', '+a.prefShaftFlex+' flex.' : '');
          h += '<div class="callout note" style="margin-top:18px"><span class="t">How that combo could perform</span>'+esc(comboRundown(hd,shf)+pspec)+'</div>';
        }
      }
    } else if (q.kind==='clubcombo'){
      var cat=state.cat, a=state.a;
      var ccBrands=BRANDS.filter(function(b){return b!=='Any';}).map(function(b){return [b,b];}).concat([['other','Other / not listed']]);
      var ccB=a.currentBrand, ccM=a.currentModel;
      h += '<div class="eyebrow" style="margin:2px 0 6px">Brand</div>'
        + '<select class="sel" onchange="setA(\'currentBrand\',this.value)">'
        + '<option value="" disabled'+(ccB?'':' selected')+'>Choose...</option>'
        + ccBrands.map(function(o){ return '<option value="'+o[0]+'"'+(ccB===o[0]?' selected':'')+'>'+esc(o[1])+'</option>'; }).join('')
        + '</select>';
      if (ccB && ccB!=='other'){
        var ccModels=modelsFor(cat,ccB).concat([['other','Other / not listed']]);
        h += '<div class="eyebrow" style="margin:16px 0 6px">Model</div>'
          + '<select class="sel" onchange="setA(\'currentModel\',this.value)">'
          + '<option value="" disabled'+(ccM?'':' selected')+'>Choose...</option>'
          + ccModels.map(function(o){ return '<option value="'+o[0]+'"'+(ccM===o[0]?' selected':'')+'>'+esc(o[1])+'</option>'; }).join('')
          + '</select>';
      } else if (ccB==='other'){
        h += '<div class="cap">No problem - we will allow for that in your matches.</div>';
      }
      if (ccB){
        var missOpts = cat==='driver'
          ? [['hook','Hook'],['low','Too low launching'],['high','Too high launching'],['slice','Slice'],['straight','Happy with my current ball flight']]
          : [['thin','Thin'],['fat','Fat / heavy'],['slice','Slice'],['hook','Hook'],['high','Too high'],['low','Too low'],['straight','Fairly straight']];
        h += '<div class="eyebrow" style="margin:16px 0 6px">Current miss</div>'
          + '<select class="sel" onchange="setA(\'miss\',this.value)">'
          + '<option value="" disabled'+(a.miss?'':' selected')+'>Choose...</option>'
          + missOpts.map(function(o){ return '<option value="'+o[0]+'"'+(a.miss===o[0]?' selected':'')+'>'+esc(o[1])+'</option>'; }).join('')
          + '</select>';
      }
    } else if (q.kind==='shaftcombo'){
      var a=state.a;
      var scB=a.currentShaftBrand;
      var scBrandOpts=SHAFT_BRANDS.map(function(b){return [b,b];}).concat([['other','Other / not listed'],['unsure','Not sure']]);
      h += '<div class="eyebrow" style="margin:2px 0 6px">Brand</div>'
        + '<select class="sel" onchange="setA(\'currentShaftBrand\',this.value)">'
        + '<option value="" disabled'+(scB?'':' selected')+'>Choose...</option>'
        + scBrandOpts.map(function(o){ return '<option value="'+o[0]+'"'+(scB===o[0]?' selected':'')+'>'+esc(o[1])+'</option>'; }).join('')
        + '</select>';
      if (scB && scB!=='other' && scB!=='unsure'){
      var scModels=shaftModelsFor(a.currentShaftBrand).concat([['other','Other / not listed'],['unsure','Not sure']]);
      var scM=a.currentShaftModel;
      var scSh=(scM && scM!=='other' && scM!=='unsure') ? shaftByModel(scM) : null;
      h += '<div class="eyebrow" style="margin:16px 0 6px">Model</div>'
        + '<select class="sel" onchange="setA(\'currentShaftModel\',this.value)">'
        + '<option value="" disabled'+(scM?'':' selected')+'>Choose...</option>'
        + scModels.map(function(o){ return '<option value="'+o[0]+'"'+(scM===o[0]?' selected':'')+'>'+esc(o[1])+'</option>'; }).join('')
        + '</select>';
      if (scSh && scSh.wts){
        var scW=a.currentShaftWeight;
        var scWf=(scW && scW!=='unsure') ? scSh.wts.find(function(w){return w[0]===scW;}) : null;
        var scFlexes=scWf ? scWf[1] : Array.from(new Set(scSh.wts.reduce(function(acc,w){return acc.concat(w[1]);},[])));
        var scF=a.currentShaftFlex;
        h += '<div class="eyebrow" style="margin:16px 0 6px">Weight</div>'
          + '<select class="sel" onchange="setA(\'currentShaftWeight\',this.value)">'
          + '<option value="" disabled'+(scW?'':' selected')+'>Choose...</option>'
          + scSh.wts.map(function(w){ return '<option value="'+w[0]+'"'+(scW===w[0]?' selected':'')+'>'+esc(w[0])+'</option>'; }).join('')
          + '<option value="unsure"'+(scW==='unsure'?' selected':'')+'>Not sure</option>'
          + '</select>'
          + '<div class="eyebrow" style="margin:16px 0 6px">Flex</div>'
          + '<select class="sel" onchange="setA(\'currentShaftFlex\',this.value)">'
          + '<option value="" disabled'+(scF?'':' selected')+'>Choose...</option>'
          + scFlexes.map(function(f){ return '<option value="'+f+'"'+(scF===f?' selected':'')+'>'+esc(f)+'</option>'; }).join('')
          + '<option value="unsure"'+(scF==='unsure'?' selected':'')+'>Not sure</option>'
          + '</select>';
      } else if (scM==='other' || scM==='unsure'){
        h += '<div class="cap">No problem - we will allow for that in your matches.</div>';
      }
      } else if (scB==='other' || scB==='unsure'){
        h += '<div class="cap">No problem - we will allow for that in your matches.</div>';
      }
    } else if (q.id==='flight'){
      var stops=q.opts;
      var idx=-1;
      stops.forEach(function(o,i){ if (val===o[0]) idx=i; });
      h += '<div class="slider-wrap">'
        + '<input type="range" min="0" max="'+(stops.length-1)+'" step="1" value="'+(idx<0?1:idx)+'" oninput="sliderPreview(this)" onchange="setSlider(\''+q.id+'\',this.value)" aria-label="'+esc(q.label)+'">'
        + '<div class="slider-labels">'+stops.map(function(o,i){ return '<span class="'+(idx===i?'on':'')+'" onclick="setSlider(\''+q.id+'\','+i+')" role="button">'+esc(o[1])+'</span>'; }).join('')+'</div>'
        + (idx<0?'<div class="cap">Slide to choose</div>':'')+'</div>';
    } else {
      h += '<div class="opts">';
      q.opts.forEach(function(o){
        h += '<button class="optbtn'+(val===o[0]?' sel':'')+'" onclick="setA(\''+q.id+'\',\''+o[0]+'\')">'+esc(o[1])+'</button>';
      });
      h += '</div>';
    }
    var canNext = Boolean(val);
    if (q.kind==='clubcombo') canNext = Boolean(state.a.currentBrand) && (state.a.currentBrand==='other' || Boolean(state.a.currentModel)) && Boolean(state.a.miss);
    if (q.kind==='prefcombo'){
      var lp2=state.a.likePart || 'neither';
      var needH = lp2==='shaft' || lp2==='neither';
      var needS = lp2==='head' || lp2==='neither';
      canNext = (!needH || Boolean(state.a.prefHead)) && (!needS || Boolean(state.a.prefShaft));
    }
    if (q.kind==='shaftcombo') canNext = Boolean(state.a.currentShaftBrand) && (state.a.currentShaftBrand==='other' || state.a.currentShaftBrand==='unsure' || Boolean(state.a.currentShaftModel));
    var last = state.step===qs.length-1;
    h += '<div class="navrow"><button class="nav-back" onclick="back()">\u2039 Back</button>'
      + '<button class="nav-next" '+(canNext?'':'disabled')+' onclick="next()">'+(last?'See my matches':'Next')+'</button></div></div>';
  }
  app.innerHTML = h;
}
function pick(c){ state.cat=c; state.step=0; render(); window.scrollTo(0,0); }
function setA(id,v){
  state.a[id]=v;
  if (id==='currentShaftBrand'){ delete state.a.currentShaftModel; delete state.a.currentShaftWeight; delete state.a.currentShaftFlex; }
  if (id==='currentShaftModel'){ delete state.a.currentShaftWeight; delete state.a.currentShaftFlex; }
  if (id==='likePart'){ delete state.a.prefHead; delete state.a.prefShaft; delete state.a.prefShaftWeight; delete state.a.prefShaftFlex; }
  if (id==='prefShaft'){ delete state.a.prefShaftWeight; delete state.a.prefShaftFlex; }
  if (id==='currentBrand'){ delete state.a.currentModel; if (v==='other') state.a.currentModel='other'; }
  render();
}
function back(){
  if (state.done){ state.done=false; render(); window.scrollTo(0,0); return; }
  var qs=buildQuestions(state.cat, state.a);
  if (state.step>0) state.step--;
  else state.cat=null;
  render(); window.scrollTo(0,0);
}
function next(){
  var qs=buildQuestions(state.cat, state.a);
  if (state.step===qs.length-1) { state.done=true; }
  else {
    state.step++;
  }
  render(); window.scrollTo(0,0);
}
function restart(){ state={cat:null,step:0,a:{},done:false}; render(); window.scrollTo(0,0); }
function bookFitting(){ alert('Fitting bookings are coming soon - for now, ask in store and we will book you in.'); }

// Hash overrides for testing/screenshots: #q=driver,5, #results-driver, #results-irons
(function(){
  var h=location.hash||'';
  if (h.indexOf('#q=')===0){
    var parts=h.slice(3).split(','); state.cat=parts[0]; state.step=Number(parts[1]||0);
    for (var i=2;i<parts.length;i++){ var kv=parts[i].split('='); state.a[kv[0]]=decodeURIComponent(kv.slice(1).join('=')); }
  } else if (h==='#results-driver'){
    state={cat:'driver',step:0,done:true,a:{dexterity:'R',speed:'90',spin:'1900',currentBrand:'other',currentModel:'other',likePart:'both',brand:'Any',miss:'low',flight:'high'}};
  } else if (h==='#results-shafts'){
    state={cat:'driver',step:0,done:true,a:{dexterity:'R',speed:'90',spin:'2850',currentBrand:'TaylorMade',currentModel:'Qi4D Driver',likePart:'head',brand:'Any',miss:'slice',flight:'mid'}};
  } else if (h==='#results-heads'){
    state={cat:'driver',step:0,done:true,a:{dexterity:'R',speed:'100',spin:'skip',currentBrand:'Ping',currentModel:'other',currentShaftBrand:'Fujikura',currentShaftModel:'Ventus Blue',currentShaftWeight:'60g',currentShaftFlex:'S',likePart:'shaft',brand:'Any',miss:'slice',flight:'mid'}};
  } else if (h==='#results-prefhead'){
    state={cat:'driver',step:0,done:true,a:{dexterity:'R',speed:'100',spin:'skip',currentBrand:'other',currentModel:'other',likePart:'neither',brand:'Ping',prefHead:'G440 LST Driver',miss:'slice',flight:'mid'}};
  } else if (h==='#results-prefshaft'){
    state={cat:'driver',step:0,done:true,a:{dexterity:'R',speed:'100',spin:'2850',currentBrand:'other',currentModel:'other',currentShaftBrand:'Fujikura',currentShaftModel:'Ventus Blue',likePart:'head',prefShaft:'Project X HZRDUS Black',brand:'Any',miss:'slice',flight:'mid'}};
  } else if (h==='#results-ball'){
    state={cat:'ball',step:0,done:true,a:{speed:'110',ballPriority:'straight',flight:'high'}};
  } else if (h==='#results-irons'){
    state={cat:'irons',step:0,done:true,a:{dexterity:'R',speed:'70',spin:'skip',currentBrand:'other',currentModel:'other',likePart:'both',brand:'Any',miss:'fat',flight:'high'}};
  }
  render();
})();
</script>
